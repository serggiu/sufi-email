[package]
name = "sufi-email"
version = "0.1.0"
description = "Sufi Email - a configurable IMAP/SMTP email client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
imap = { version = "3.0.0-alpha.15", default-features = false, features = [
  "rustls-tls",
] }
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "builder",
  "tokio1",
  "tokio1-rustls-tls",
] }
mail-parser = "0.11"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
cocoon = "0.5.0"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2.7.2"
sha2 = "0.11.0"

[profile.dev]
incremental = true
