[package]
name = "sufi-email"
version = "0.1.0"
description = "Sufi Email - a configurable IMAP/SMTP email client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
glib = "0.18"
imap = { version = "3.0.0-alpha.15", default-features = false, features = [
  "rustls-tls",
] }
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "builder",
  "tokio1",
  "tokio1-rustls-tls",
] }
mail-parser = "0.11"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
cocoon = "0.5.0"
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = { version = "2.7.2", default-features = false, features = ["xdg-portal"] }
notify-rust = "4.18"
# Session-bus queries for the tray watcher monitor, which keeps the tray
# safe from libayatana-appindicator's tooltip use-after-free (see the
# TraySafety docs in main.rs). Features mirror notify-rust's zbus so the two
# share one executor.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
sha2 = "0.11.0"

[profile.dev]
incremental = true

[dev-dependencies]
tempfile = "3.27.0"

# tray-icon 0.24.2's Linux backend maps set_title to the StatusNotifierItem
# Label property (hosts show Title as the tooltip). Vendored with a one-line
# fix so tauri's TrayIcon::set_title updates the tooltip text.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
libappindicator = { path = "vendor/libappindicator" }
